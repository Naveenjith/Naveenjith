name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create root folder for SVG
        run: mkdir -p .

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Naveenjith
          svg_out_path: snake.svg   # Generate directly in root
          gif_out_path: snake.gif

      - name: Commit and Push Snake
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake.gif
          git commit -m "Update GitHub Snake SVG" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
