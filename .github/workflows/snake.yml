name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: naveenjith      # lowercase username
          include_private: true            # include private contributions
          svg_out_path: snake.svg           # generate in main branch root
          gif_out_path: snake.gif

      - name: Commit and Push Snake (if generated)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f snake.svg ]; then
            git add snake.svg snake.gif
            git commit -m "Update GitHub Snake SVG" || echo "No changes to commit"
            git push
          else
            echo "Snake SVG not generated yet."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
