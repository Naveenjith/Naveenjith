name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake (Cyberpunk Style 🐍✨)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Naveenjith
          outputs: dist/snake.svg
        env:
          # Snake colors (neon/cyberpunk style)
          SNAKE_COLOR: "#00FFFF"     # Neon cyan
          APPLE_COLOR: "#FF00FF"     # Magenta
          BACKGROUND_COLOR: "#0D0D0D" # Dark techy background
          GRID_COLOR: "#222222"      # Subtle dark grid

      - name: Push Snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
